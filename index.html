<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ramadan Companion 1448</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1026; --bg2:#111a3a; --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.09); --line:rgba(255,255,255,.10);
  --text:#eef1fb; --muted:#9aa4c7; --gold:#e9c46a; --gold2:#f4d58d; --teal:#2ec4b6; --rose:#ff7b8a; --green:#4ade80;
  --radius:18px; --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --arabic:"Amiri","Traditional Arabic",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#2b2a6b 0%,transparent 60%),radial-gradient(900px 500px at -10% 10%,#14325a 0%,transparent 55%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--muted);white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;backdrop-filter:blur(6px)}
.card h2{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);margin:0 0 12px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:12px} .center{text-align:center}
.hero{text-align:center;padding:22px 16px 18px;position:relative;overflow:hidden}
.hero .day{font-size:13px;color:var(--gold2);letter-spacing:1px;text-transform:uppercase;font-weight:600}
.hero .label{font-size:15px;color:var(--muted);margin-top:14px}
.hero .count{font-size:52px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums;margin:2px 0;line-height:1.1}
.hero .at{color:var(--muted);font-size:14px}
.hero .hijri{font-family:var(--arabic);font-size:18px;color:var(--gold2);margin-top:6px}
.ring{width:210px;height:210px;margin:6px auto 0;position:relative}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.times{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.t{background:var(--card2);border-radius:14px;padding:10px 8px;text-align:center;border:1px solid transparent}
.t b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.t span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.t.key{border-color:rgba(233,196,106,.55);background:rgba(233,196,106,.10)}
.t.next{box-shadow:0 0 0 2px var(--teal) inset}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:var(--teal);border-color:var(--teal);color:#062a27;font-weight:700}
.chip.gold.on{background:var(--gold);border-color:var(--gold);color:#2b1f00}
.chip.rose.on{background:var(--rose);border-color:var(--rose);color:#3a0710}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--gold);color:#2b1f00;font-weight:700}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:20px;cursor:pointer}
.stepper input{width:70px;text-align:center;background:transparent;border:1px solid var(--line);border-radius:12px;padding:8px;font-size:17px;font-weight:700}
label.f{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
input.in,select.in,textarea.in{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--gold)}
select.in option{background:#111a3a}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--gold);color:#2b1f00}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.block{width:100%}
.grid30{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.dcell{aspect-ratio:1;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1px solid transparent;position:relative;font-variant-numeric:tabular-nums}
.dcell b{font-size:15px} .dcell i{font-style:normal;font-size:9px;color:var(--muted)}
.dcell.sel{border-color:var(--gold)} .dcell.today{box-shadow:0 0 0 2px var(--teal) inset}
.dcell.odd::after{content:"★";position:absolute;top:2px;right:5px;font-size:9px;color:var(--gold)}
.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:99px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:14px;padding:12px}
.stat b{font-size:22px;display:block;font-variant-numeric:tabular-nums} .stat span{font-size:12px;color:var(--muted)}
.tasbih{width:230px;height:230px;border-radius:50%;margin:10px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;
  background:radial-gradient(circle at 35% 30%,#3b4a8c,#1a2350 70%);border:2px solid rgba(233,196,106,.45);box-shadow:0 10px 40px rgba(0,0,0,.4),inset 0 0 30px rgba(233,196,106,.12);transition:transform .08s}
.tasbih:active{transform:scale(.97)}
.tasbih .n{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums}
.ar{font-family:var(--arabic);font-size:24px;direction:rtl;line-height:1.9;color:var(--gold2)}
table.tt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.tt th{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--gold);text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
table.tt td{padding:8px 4px;white-space:nowrap;border-bottom:1px solid var(--line)}
table.tt tr.today td{background:rgba(46,196,182,.14)}
table.tt tr.odd td:first-child{color:var(--gold)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 12px;text-align:left;cursor:pointer}
.menu button b{display:block;font-size:15px;margin-top:6px} .menu button span{font-size:12px;color:var(--muted)}
.menu .ico{font-size:22px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(11,16,38,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav.bottom .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{background:transparent;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:6px 0;cursor:pointer}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button.on{color:var(--gold)}
.stars{font-size:22px;letter-spacing:2px;color:var(--gold)}
.kidrow{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.kidrow div{aspect-ratio:1;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:12px}
.kidrow div.got{background:rgba(233,196,106,.25);color:var(--gold2)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--gold);color:#2b1f00;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.list .it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.check{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.check.on{background:var(--teal);border-color:var(--teal);color:#062a27;font-weight:800}
.back{background:transparent;border:0;color:var(--gold);font-weight:600;padding:4px 0 10px;cursor:pointer}
.warn{border-left:3px solid var(--gold);padding-left:10px}
.hide{display:none!important}
@media print{
  body{background:#fff;color:#000} nav.bottom,header.top,.noprint{display:none!important}
  .card{border:0;background:#fff;padding:0} .wrap{max-width:none;padding:0}
  table.tt th{color:#000} table.tt td,table.tt th{border-bottom:1px solid #ccc} table.tt tr.today td{background:none}
  .printhead{display:block!important;color:#000}
}
.printhead{display:none}
</style>
</head>
